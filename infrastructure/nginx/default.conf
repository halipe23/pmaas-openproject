upstream presidencia {
    ip_hash;
    server op_presidencia_1:8080 max_fails=3 fail_timeout=10s;
    server op_presidencia_2:8080 max_fails=3 fail_timeout=10s;
}

upstream comercial {
    ip_hash;
    server op_comercial_1:8080 max_fails=3 fail_timeout=10s;
    server op_comercial_2:8080 max_fails=3 fail_timeout=10s;
}

upstream engenharia {
    ip_hash;
    server op_engenharia_1:8080 max_fails=3 fail_timeout=10s;
    server op_engenharia_2:8080 max_fails=3 fail_timeout=10s;
}

# 1. Presidência
server {
    listen 80;
    server_name presidencia.ancora.local;

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://presidencia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Comercial
