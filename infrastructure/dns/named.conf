options {
    directory "/var/cache/bind";

    forwarders {
        1.1.1.1;
        8.8.8.8;
    };

    allow-query { any; };
    allow-recursion { any; };
    recursion yes;

    listen-on { any; };
    listen-on-v6 { any; };

    dnssec-validation auto;
};

zone "ancora.local" {
    type master;
    file "/etc/bind/db.ancora.local";
};