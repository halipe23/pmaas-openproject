networks:
  pmaas_network:
    driver: bridge

volumes:
  pgdata_primary:
  redis_data:
  # Volumes compartilhados para garantir persistência de anexos entre instâncias redundantes
  op_presidencia_files:
  op_comercial_files:
  op_engenharia_files:

services:
  # --- DNS ---
  bind9_dns:
    image: ubuntu/bind9:latest
    container_name: bind9_dns
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/db.ancora.local:/etc/bind/db.ancora.local:ro
    networks:
      - pmaas_network
    restart: always

  # --- CACHE ---
  redis_cache:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pmaas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # --- BANCO DE DADOS PRIMÁRIO ---
  dbprimary:
    image: postgres:15-alpine
    container_name: dbprimary
    environment:
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: openproject_password
      POSTGRES_DB: openproject
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    volumes:
      - pgdata_primary:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - ./postgres/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    networks:
      - pmaas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openproject -d openproject"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # --- BANCO DE DADOS RÉPLICA ---
  dbreplica:
    image: postgres:15-alpine
    container_name: dbreplica
    depends_on:
      dbprimary:
        condition: service_healthy
    networks:
      - pmaas_network
    volumes:
      - ./postgres/setup-replica.sh:/setup-replica.sh
    entrypoint: ["/bin/sh", "/setup-replica.sh"]
    restart: always

  # --- APLICAÇÕES: PRESIDÊNCIA ---
  op_presidencia_1:
    image: openproject/openproject:13
    container_name: op_presidencia_1
    environment:
      OPENPROJECT_DATABASE_HOST: dbprimary
      OPENPROJECT_DATABASE_PORT: 5432
      OPENPROJECT_DATABASE_NAME: openproject_presidencia
      OPENPROJECT_DATABASE_USER: openproject
      OPENPROJECT_DATABASE_PASSWORD: openproject_password
      OPENPROJECT_RAILS_CACHE_STORE: "redis"
      OPENPROJECT_REDIS_URL: "redis://redis_cache:6379/0"
      OPENPROJECT_SESSION_STORE: "cache_store"
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_HOST__NAME: "presidencia.ancora.local"
    volumes:
      - op_presidencia_files:/var/openproject/assets
    depends_on:
      dbprimary:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - pmaas_network
    restart: always

  op_presidencia_2:
    image: openproject/openproject:13
    container_name: op_presidencia_2
    environment:
      OPENPROJECT_DATABASE_HOST: dbprimary
      OPENPROJECT_DATABASE_PORT: 5432
      OPENPROJECT_DATABASE_NAME: openproject_presidencia
      OPENPROJECT_DATABASE_USER: openproject
      OPENPROJECT_DATABASE_PASSWORD: openproject_password
      OPENPROJECT_RAILS_CACHE_STORE: "redis"
      OPENPROJECT_REDIS_URL: "redis://redis_cache:6379/0"
      OPENPROJECT_SESSION_STORE: "cache_store"
      OPENPROJECT_HTTPS: "false"
