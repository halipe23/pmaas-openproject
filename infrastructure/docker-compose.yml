  # --- LOAD BALANCER ---
  nginx_lb:
    image: nginx:alpine
    container_name: nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - op_presidencia_1
      - op_presidencia_2
      - op_comercial_1
      - op_comercial_2
      - op_engenharia_1
      - op_engenharia_2
    networks:
      - pmaas_network
    restart: always
